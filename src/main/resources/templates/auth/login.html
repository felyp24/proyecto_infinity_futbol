<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Infinity Fútbol</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #212529;
        }

        .contenedor {
            width: 92%;
            max-width: 430px;
        }

        .panel {
            padding: 30px;
            background-color: white;
            border: 1px solid #dfe3e8;
            border-radius: 8px;
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
        }

        .descripcion {
            margin: 0 0 24px;
            color: #606770;
            text-align: center;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-bottom: 17px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #bfc5cc;
            border-radius: 5px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #198754;
        }

        button {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 5px;
            color: white;
            background-color: #198754;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #157347;
        }

        .mensaje {
            margin-bottom: 18px;
            padding: 12px;
            border-radius: 5px;
        }

        .mensaje-exito {
            color: #0f5132;
            background-color: #d1e7dd;
        }

        .mensaje-error {
            color: #842029;
            background-color: #f8d7da;
        }

        .registro {
            margin-top: 20px;
            text-align: center;
        }

        a {
            color: #0d6efd;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .oculto {
            display: none;
        }

        button:disabled {
            background-color: #adb5bd;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

<main class="contenedor">

    <section class="panel">

        <h1>Iniciar sesión</h1>

        <p class="descripcion">
            Ingresa a tu cuenta de Infinity Fútbol.
        </p>

        <div th:if="${registroExitoso}"
             class="mensaje mensaje-exito">
            Tu cuenta fue registrada correctamente.
            Ahora puedes iniciar sesión.
        </div>

        <div th:if="${param.error}"
             class="mensaje mensaje-error">
            El usuario o la contraseña son incorrectos.
        </div>

        <div th:if="${param.logout}"
             class="mensaje mensaje-exito">
            La sesión fue cerrada correctamente.
        </div>

        <div id="mensajeEstado"
             class="mensaje mensaje-error oculto">
        </div>

        <form id="formularioLogin">

            <div class="campo">
                <label for="username">
                    Nombre de usuario
                </label>

                <input id="username"
                       name="username"
                       type="text"
                       autocomplete="username"
                       required>
            </div>

            <div class="campo">
                <label for="password">
                    Contraseña
                </label>

                <input id="password"
                       name="password"
                       type="password"
                       autocomplete="current-password"
                       required>
            </div>

            <button id="botonLogin"
                    type="submit">
                Iniciar sesión
            </button>

        </form>

        <div class="registro">
            ¿No tienes una cuenta?

            <a th:href="@{/registro}">
                Regístrate
            </a>
        </div>

    </section>

</main>
<script th:src="@{/js/auth/login.js}"></script>
</body>
</html>
