<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Seguridad de la cuenta | Infinity Fútbol</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            color: #212529;
        }

        .contenedor {
            width: 92%;
            max-width: 700px;
            margin: 40px auto;
        }

        .encabezado {
            margin-bottom: 24px;
        }

        .encabezado h1 {
            margin: 0 0 8px;
        }

        .encabezado p {
            margin: 0;
            color: #606770;
        }

        .panel {
            padding: 24px;
            background-color: white;
            border: 1px solid #dfe3e8;
            border-radius: 8px;
        }

        .campo {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }

        label {
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            font-size: 14px;
        }

        input:focus {
            border-color: #198754;
            outline: none;
        }

        .ayuda {
            font-size: 12px;
            color: #6c757d;
        }

        .acciones {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        .boton {
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
        }

        .boton-volver {
            color: #212529;
            background-color: #e9ecef;
        }

        .boton-guardar {
            color: white;
            background-color: #198754;
        }

        .boton-guardar:hover {
            background-color: #157347;
        }

        .boton-guardar:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        .mensaje {
            display: none;
            margin-bottom: 20px;
            padding: 14px;
            border-radius: 6px;
        }

        .mensaje-exito {
            display: block;
            color: #0f5132;
            background-color: #d1e7dd;
        }

        .mensaje-error {
            display: block;
            color: #842029;
            background-color: #f8d7da;
        }

        @media (max-width: 600px) {
            .acciones {
                flex-direction: column-reverse;
            }

            .boton {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<main class="contenedor">

    <header class="encabezado">

        <h1>Seguridad de la cuenta</h1>

        <p>
            Modifica tu nombre de usuario o establece una nueva contraseña.
        </p>

    </header>

    <section class="panel">

        <div id="mensaje"
             class="mensaje">
        </div>

        <form id="formCredenciales">

            <div class="campo">

                <label for="nuevoUsername">
                    Nombre de usuario
                </label>

                <input id="nuevoUsername"
                       name="nuevoUsername"
                       type="text"
                       maxlength="50"
                       required
                       th:value="${usernameActual}"
                       autocomplete="username">

            </div>

            <div class="campo">

                <label for="passwordActual">
                    Contraseña actual
                </label>

                <input id="passwordActual"
                       name="passwordActual"
                       type="password"
                       required
                       autocomplete="current-password">

                <span class="ayuda">
                    Debes confirmar tu contraseña actual para guardar los cambios.
                </span>

            </div>

            <div class="campo">

                <label for="nuevaPassword">
                    Nueva contraseña
                </label>

                <input id="nuevaPassword"
                       name="nuevaPassword"
                       type="password"
                       minlength="8"
                       autocomplete="new-password">

                <span class="ayuda">
                    Déjala vacía si solo deseas cambiar el nombre de usuario.
                </span>

            </div>

            <div class="campo">

                <label for="confirmarPassword">
                    Confirmar nueva contraseña
                </label>

                <input id="confirmarPassword"
                       name="confirmarPassword"
                       type="password"
                       minlength="8"
                       autocomplete="new-password">

            </div>

            <div class="acciones">

                <a class="boton boton-volver"
                   th:href="@{/perfil}">
                    Cancelar
                </a>

                <button id="botonGuardar"
                        class="boton boton-guardar"
                        type="submit"
                        disabled>
                    Guardar cambios
                </button>

            </div>

        </form>

    </section>

</main>

<script th:src="@{/js/perfil/seguridad.js}"></script>

</body>
</html>
