<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Gestión de clases | Infinity Fútbol</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >

    <style>
        body {
            background-color: #f4f6f8;
        }

        .encabezado {
            background-color: #143d2b;
            color: white;
        }

        .tarjeta-formulario {
            border: none;
            border-radius: 12px;
        }

        .tabla-contenedor {
            overflow-x: auto;
        }

        .titulo-seccion {
            color: #143d2b;
            font-weight: 700;
        }

        .badge-programada {
            background-color: #198754;
        }
    </style>

    <script
            th:src="@{/js/coordinador-clases.js}"
            defer>
    </script>
</head>

<body>

<header class="encabezado py-3">
    <div class="container d-flex
                justify-content-between
                align-items-center">

        <div>
            <h1 class="h4 mb-0">
                Infinity Fútbol
            </h1>

            <small>
                Módulo de coordinación
            </small>
        </div>

        <a
                th:href="@{/perfil}"
                class="btn btn-outline-light"
        >
            Mi perfil
        </a>
    </div>
</header>

<main class="container py-4">

    <div class="mb-4">
        <h2 class="titulo-seccion">
            Gestión de clases
        </h2>

        <p class="text-muted mb-0">
            Registra las clases disponibles para los alumnos.
        </p>
    </div>

    <div
            id="mensaje"
            class="alert d-none"
            role="alert"
    ></div>

    <section class="card tarjeta-formulario shadow-sm mb-4">

        <div class="card-body p-4">

            <h3 class="h5 titulo-seccion mb-3">
                Registrar nueva clase
            </h3>

            <form id="formCrearClase">

                <div class="row g-3">

                    <div class="col-md-8">
                        <label
                                for="titulo"
                                class="form-label"
                        >
                            Título
                        </label>

                        <input
                                type="text"
                                id="titulo"
                                class="form-control"
                                maxlength="100"
                                required
                        >
                    </div>

                    <div class="col-md-4">
                        <label
                                for="fechaClase"
                                class="form-label"
                        >
                            Fecha
                        </label>

                        <input
                                type="date"
                                id="fechaClase"
                                class="form-control"
                                required
                        >
                    </div>

                    <div class="col-12">
                        <label
                                for="descripcion"
                                class="form-label"
                        >
                            Descripción
                        </label>

                        <textarea
                                id="descripcion"
                                class="form-control"
                                rows="3"
                                maxlength="255"
                        ></textarea>
                    </div>

                    <div class="col-md-3">
                        <label
                                for="horaInicio"
                                class="form-label"
                        >
                            Hora de inicio
                        </label>

                        <input
                                type="time"
                                id="horaInicio"
                                class="form-control"
                                required
                        >
                    </div>

                    <div class="col-md-3">
                        <label
                                for="horaFin"
                                class="form-label"
                        >
                            Hora de finalización
                        </label>

                        <input
                                type="time"
                                id="horaFin"
                                class="form-control"
                                required
                        >
                    </div>

                    <div class="col-md-3">
                        <label
                                for="cupoMaximo"
                                class="form-label"
                        >
                            Cupo máximo
                        </label>

                        <input
                                type="number"
                                id="cupoMaximo"
                                class="form-control"
                                min="1"
                                max="100"
                                value="15"
                                required
                        >
                    </div>

                    <div class="col-md-3">
                        <label
                                for="idCancha"
                                class="form-label"
                        >
                            Cancha
                        </label>

                        <select
                                id="idCancha"
                                class="form-select"
                                required
                        >
                            <option value="">
                                Cargando canchas...
                            </option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label
                                for="idEntrenador"
                                class="form-label"
                        >
                            Entrenador
                        </label>

                        <select
                                id="idEntrenador"
                                class="form-select"
                                required
                        >
                            <option value="">
                                Cargando entrenadores...
                            </option>
                        </select>
                    </div>

                    <div class="col-12 d-flex
                                justify-content-end">

                        <button
                                type="submit"
                                id="btnCrearClase"
                                class="btn btn-success px-4"
                        >
                            Registrar clase
                        </button>
                    </div>

                </div>
            </form>
        </div>
    </section>

    <section class="card tarjeta-formulario shadow-sm">

        <div class="card-body p-4">

            <div class="d-flex
                        justify-content-between
                        align-items-center
                        mb-3">

                <h3 class="h5 titulo-seccion mb-0">
                    Clases programadas
                </h3>

                <button
                        type="button"
                        id="btnActualizar"
                        class="btn btn-outline-secondary btn-sm"
                >
                    Actualizar
                </button>
            </div>

            <div class="tabla-contenedor">

                <table class="table table-hover align-middle">

                    <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Horario</th>
                        <th>Clase</th>
                        <th>Entrenador</th>
                        <th>Sede y cancha</th>
                        <th>Cupos</th>
                        <th>Estado</th>
                    </tr>
                    </thead>

                    <tbody id="tablaClases">

                    <tr>
                        <td
                                colspan="7"
                                class="text-center text-muted"
                        >
                            Cargando clases...
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

</body>
</html>
