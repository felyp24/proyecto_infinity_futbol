<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>
        Control de asistencia | Infinity Fútbol
    </title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >

    <link
            th:href="@{/css/componentes/navbar.css}"
            rel="stylesheet"
    >

    <link
            th:href="@{/css/coordinador/asistencias.css}"
            rel="stylesheet"
    >

</head>

<body>

<div
        th:replace="~{fragments/navbar :: navbar}"
></div>

<main class="asistencia-contenedor">

    <header class="asistencia-encabezado">

        <h1>
            Control de asistencia
        </h1>

        <p>
            Selecciona una clase y registra la asistencia
            de los alumnos que realizaron una reserva.
        </p>

    </header>

    <section class="asistencia-panel">

        <div class="asistencia-filtros">

            <div class="asistencia-campo">

                <label for="fechaClases">
                    Fecha de la clase
                </label>

                <input
                        id="fechaClases"
                        type="date"
                >

            </div>

            <div class="asistencia-campo">

                <label for="selectClase">
                    Clase
                </label>

                <select id="selectClase">

                    <option value="">
                        Seleccione una clase
                    </option>

                </select>

            </div>

            <button
                    id="botonActualizar"
                    type="button"
                    class="btn btn-outline-success"
            >
                Actualizar
            </button>

        </div>

        <div
                id="mensajePagina"
                class="alert alert-info"
                role="alert"
        >
            Selecciona la fecha de la clase.
        </div>

        <div
                id="contenidoAsistencia"
                class="oculto"
        >

            <div class="clase-seleccionada">

                <div>

                    <h2 id="tituloClaseSeleccionada">
                        Clase
                    </h2>

                    <p id="detalleClaseSeleccionada">
                        -
                    </p>

                </div>

                <div
                        id="contadorMarcacion"
                        class="clase-contador"
                >
                    0 de 0 registrados
                </div>

            </div>

            <div class="acciones-masivas">

                <button
                        id="botonTodosPresentes"
                        type="button"
                        class="btn btn-outline-success"
                >
                    Todos presentes
                </button>

                <button
                        id="botonTodosAusentes"
                        type="button"
                        class="btn btn-outline-danger"
                >
                    Todos ausentes
                </button>

            </div>

            <div class="tabla-contenedor">

                <table class="tabla-asistencia">

                    <thead>

                    <tr>
                        <th>Alumno</th>
                        <th>Documento</th>
                        <th>Reserva</th>
                        <th>Estado</th>
                        <th>Hora registrada</th>
                        <th>Observación</th>
                    </tr>

                    </thead>

                    <tbody id="tablaAlumnos">
                    </tbody>

                </table>

            </div>

            <div class="asistencia-pie">

                <span>
                    Debes seleccionar un estado
                    para cada alumno.
                </span>

                <button
                        id="botonGuardarAsistencias"
                        type="button"
                        class="btn btn-success"
                >
                    Guardar asistencias
                </button>

            </div>

        </div>

    </section>

</main>

<script
        th:src="@{/js/componentes/navbar.js}"
></script>

<script
        th:src="@{/js/coordinador/asistencias.js}"
></script>

<script
        th:src="@{/js/auth/logout.js}"
></script>

</body>
</html>
