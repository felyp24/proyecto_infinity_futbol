<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Historial de créditos | Infinity Fútbol
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            color: #212529;
            background-color: #f4f6f8;

            font-family: Arial, sans-serif;
        }

        .contenedor {
            width: 95%;
            max-width: 1300px;

            margin: 40px auto;
        }

        .encabezado {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 24px;
        }

        .encabezado h1 {
            margin: 0 0 8px;
        }

        .encabezado p {
            margin: 0;
            color: #606770;
        }

        .acciones-encabezado {
            display: flex;
            flex-wrap: wrap;

            gap: 10px;
        }

        .enlace,
        button {
            display: inline-block;

            padding: 9px 14px;

            color: #ffffff;
            background-color: #198754;

            border: none;
            border-radius: 5px;

            font-size: 14px;
            text-decoration: none;

            cursor: pointer;
        }

        .enlace:hover,
        button:hover {
            background-color: #157347;
        }

        .enlace-secundario,
        .boton-secundario {
            background-color: #6c757d;
        }

        .enlace-secundario:hover,
        .boton-secundario:hover {
            background-color: #5c636a;
        }

        .boton-logout {
            background-color: #dc3545;
        }

        .boton-logout:hover {
            background-color: #bb2d3b;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        .panel {
            padding: 24px;

            background-color: #ffffff;

            border: 1px solid #dfe3e8;
            border-radius: 8px;
        }

        .buscador {
            display: flex;
            flex-wrap: wrap;

            gap: 10px;

            margin-bottom: 20px;
        }

        .buscador input {
            flex: 1;
            min-width: 260px;

            padding: 10px 12px;

            border: 1px solid #bfc5cc;
            border-radius: 5px;

            font-size: 14px;
        }

        .buscador input:focus {
            outline: none;

            border-color: #198754;

            box-shadow: 0 0 0 3px
                        rgba(25, 135, 84, 0.12);
        }

        .mensaje {
            margin-bottom: 18px;
            padding: 14px;

            color: #084298;
            background-color: #cfe2ff;

            border-radius: 6px;
        }

        .mensaje-error {
            color: #842029;
            background-color: #f8d7da;
        }

        .oculto {
            display: none !important;
        }

        .resumen {
            margin-bottom: 16px;

            color: #606770;
            font-size: 14px;
        }

        .tabla-contenedor {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 1100px;

            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;

            text-align: left;
            vertical-align: middle;

            border-bottom: 1px solid #e5e7eb;

            font-size: 14px;
        }

        th {
            color: #343a40;
            background-color: #f8f9fa;
        }

        tbody tr:hover {
            background-color: #f8fbf9;
        }

        .dato-principal {
            display: block;

            margin-bottom: 3px;

            font-weight: bold;
        }

        .dato-secundario {
            display: block;

            color: #6c757d;
            font-size: 12px;
        }

        .cambio {
            display: inline-block;

            min-width: 95px;

            padding: 7px 11px;

            border-radius: 14px;

            text-align: center;
            font-weight: bold;
        }

        .cambio-positivo {
            color: #0f5132;
            background-color: #d1e7dd;
        }

        .cambio-negativo {
            color: #842029;
            background-color: #f8d7da;
        }

        .tipo-cambio {
            display: inline-block;

            padding: 5px 9px;

            border-radius: 12px;

            font-size: 12px;
            font-weight: bold;
        }

        .tipo-aumento {
            color: #0f5132;
            background-color: #d1e7dd;
        }

        .tipo-reduccion {
            color: #842029;
            background-color: #f8d7da;
        }

        .descripcion {
            max-width: 430px;

            color: #495057;
            line-height: 1.45;
        }

        .paginacion {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 16px;

            margin-top: 20px;
        }

        .paginacion-botones {
            display: flex;
            gap: 8px;
        }

        @media (max-width: 767px) {

            .contenedor {
                width: 94%;
                margin: 24px auto;
            }

            .encabezado {
                align-items: flex-start;
                flex-direction: column;
            }

            .panel {
                padding: 16px;
            }

            .buscador {
                flex-direction: column;
            }

            .buscador input,
            .buscador button {
                width: 100%;
            }

            .paginacion {
                align-items: stretch;
                flex-direction: column;
            }

            .paginacion-botones button {
                flex: 1;
            }
        }

    </style>

</head>

<body>

<main class="contenedor">

    <header class="encabezado">

        <div>

            <h1>
                Historial de ajustes de créditos
            </h1>

            <p>
                Consulta los aumentos y reducciones
                realizados por la administración.
            </p>

        </div>

        <div class="acciones-encabezado">

            <a class="enlace enlace-secundario"
               th:href="@{/admin/creditos}">
                Volver al gestor
            </a>

            <a class="enlace enlace-secundario"
               th:href="@{/admin/roles}">
                Gestión de roles
            </a>

            <button id="botonLogout"
                    class="boton-logout"
                    type="button">
                Cerrar sesión
            </button>

        </div>

    </header>

    <section class="panel">

        <form id="formularioBusqueda"
              class="buscador">

            <input id="textoBusqueda"
                   type="search"
                   maxlength="100"
                   autocomplete="off"
                   placeholder="Buscar por alumno, documento, usuario, responsable o motivo">

            <button type="submit">
                Buscar
            </button>

            <button id="botonLimpiar"
                    class="boton-secundario"
                    type="button">
                Limpiar
            </button>

        </form>

        <div id="mensajeEstado"
             class="mensaje">
            Cargando historial...
        </div>

        <div id="contenidoHistorial"
             class="oculto">

            <div id="resumen"
                 class="resumen">
            </div>

            <div class="tabla-contenedor">

                <table>

                    <thead>

                    <tr>
                        <th>Fecha</th>
                        <th>Alumno</th>
                        <th>Usuario</th>
                        <th>Cambio</th>
                        <th>Tipo</th>
                        <th>Detalle del ajuste</th>
                    </tr>

                    </thead>

                    <tbody id="tablaHistorial">
                    </tbody>

                </table>

            </div>

            <div class="paginacion">

                <span id="informacionPagina">
                </span>

                <div class="paginacion-botones">

                    <button id="botonAnterior"
                            class="boton-secundario"
                            type="button">
                        Anterior
                    </button>

                    <button id="botonSiguiente"
                            class="boton-secundario"
                            type="button">
                        Siguiente
                    </button>

                </div>

            </div>

        </div>

    </section>

</main>

<script th:src="@{/js/admin/creditos-historial.js}"></script>

<script th:src="@{/js/auth/logout.js}"></script>

</body>
</html>
