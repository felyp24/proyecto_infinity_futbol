spring.application.name=infinity-futbol
# Conexión con MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/infinity_futbol_db?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:123456}

# Configuración de JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_boolean_jdbc_type=TINYINT
spring.profiles.active=dev

# Thymeleaf
spring.thymeleaf.cache=false

# Puerto del sistema
server.port=8080

# Configuración JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=30
security.jwt.cookie-name=ACCESS_TOKEN
security.jwt.issuer=infinity-futbol
security.jwt.cookie-secure=false


# MERCADO PAGO


mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
mercadopago.currency=PEN

# URL pública HTTPS del proyecto.
# Para desarrollo se reemplazará usando un túnel HTTPS.
app.public-url=${APP_PUBLIC_URL:http://localhost:8080}